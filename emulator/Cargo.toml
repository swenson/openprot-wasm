# Licensed under the Apache-2.0 license
#
# The Caliptra subsystem emulator (Caliptra core and the VeeR MCU) with
# host-side drivers for OpenPRoT test scenarios. Builds for wasm32 (the page
# in ../www) and for the host (tests/scenarios.rs).

[package]
name = "openprot-wasm"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"
rand = { version = "0.8", features = ["std_rng"] }
getrandom = { version = "0.2", features = ["js"] }
getrandom04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }
uuid = { version = "1", features = ["js"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The emulator. The MCU model's revision is the newest of caliptra-mcu-sw's
# main-2.1 line that builds for wasm32; OpenPRoT's own pin
# (third_party/caliptra/versions.bzl) is an ancestor of it. Keep the
# caliptra-sw revision the one that caliptra-mcu-sw revision depends on.
caliptra-api = { git = "https://github.com/chipsalliance/caliptra-sw", rev = "757b7445b18483d624612f03b195cbff2b415963" }
caliptra-hw-model = { git = "https://github.com/chipsalliance/caliptra-sw", rev = "757b7445b18483d624612f03b195cbff2b415963", default-features = false }
caliptra-hw-model-types = { git = "https://github.com/chipsalliance/caliptra-sw", rev = "757b7445b18483d624612f03b195cbff2b415963" }
mcu-hw-model = { git = "https://github.com/swenson/caliptra-mcu-sw", rev = "81c58651e7dbcf842ed61bee031f3358893d12f8", package = "caliptra-mcu-hw-model", default-features = false }
mcu-emulator-periph = { git = "https://github.com/swenson/caliptra-mcu-sw", rev = "81c58651e7dbcf842ed61bee031f3358893d12f8", package = "caliptra-mcu-emulator-periph" }
mcu-testing-common = { git = "https://github.com/swenson/caliptra-mcu-sw", rev = "81c58651e7dbcf842ed61bee031f3358893d12f8", package = "caliptra-mcu-testing-common" }

# caliptra-cfi-lib uses inline assembly that does not build for wasm32. CFI
# hardens firmware; the emulator does not need it.
[patch."https://github.com/chipsalliance/caliptra-cfi.git"]
caliptra-cfi-lib = { path = "cfi-shim" }

[profile.release]
opt-level = "s"
lto = true

# The host tests run the emulator for tens of millions of cycles.
[profile.test]
opt-level = 3
